name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # 작업 브랜치 트리거는 넣지 않는다 — 검증 전 코드가 운영 앱으로 나가고,
      # 브랜치가 사라진 뒤에도 남아 빨간불만 쌓는다(manmool 에서 12연속 실패가 그것).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install security test browser
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/hj-e2e" --no-save --package-lock=false playwright@1.55.0
          "$RUNNER_TEMP/hj-e2e/node_modules/.bin/playwright" install --with-deps chromium

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify release guards (full suite)
        shell: bash
        run: |
          set -euo pipefail
          # 예전에는 82개 중 8개만 돌렸다 — 나머지는 "로컬에서 돌렸다"는 말에
          # 의존했고, 게이트가 못 보는 회귀가 실제로 있었다. 이제 전부 돈다.
          # (러너가 static-server 8299 · mock-relay 8398 을 직접 띄우고 끈다)
          export NODE_PATH="$RUNNER_TEMP/hj-e2e/node_modules"
          # 옛 e2e 상당수가 /opt/pw-browsers/chromium 을 하드코딩한다 — 심링크로 맞춘다
          CHROME="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sfn "$CHROME" /opt/pw-browsers/chromium
          export PLAYWRIGHT_EXECUTABLE="$CHROME"
          node tests/run-all.js

      - name: Stage public site allowlist
        run: node scripts/stage-pages.mjs _site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # 공개 앱 셸만 업로드 — backup/, tests/, apps-script/는 Pages에 노출하지 않는다.
          path: "_site"
          # v5는 숨김 파일을 기본 제외하므로 Pages의 .nojekyll을 명시적으로 보존한다.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
