name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # 작업 브랜치 트리거는 넣지 않는다 — 검증 전 코드가 운영 앱으로 나가고,
      # 브랜치가 사라진 뒤에도 남아 빨간불만 쌓는다(manmool 에서 12연속 실패가 그것).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 단일 파일 PWA(index.html + sw.js) — 저장소 루트를 그대로 업로드
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
