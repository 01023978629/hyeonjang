name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # 작업 브랜치 트리거는 넣지 않는다 — 검증 전 코드가 운영 앱으로 나가고,
      # 브랜치가 사라진 뒤에도 남아 빨간불만 쌓는다(manmool 에서 12연속 실패가 그것).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # 병합 전 검사 기록(verified-tree-*)·그 실행을 읽는다 — scripts/verified-tree.mjs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # ubuntu-latest 가 26.04 로 넘어가면서(2026-11-17 확인) playwright@1.55.0 이 브라우저를 못 깐다
    # ('Playwright does not support chromium on ubuntu26.04-x64') — 검사가 시작도 못 한다. 11/15 까지 통과하던 24.04 로 고정한다.
    # playwright 를 26.04 지원 판으로 올릴 때 같이 풀 것(브라우저 판이 바뀌므로 전체 회귀를 다시 봐야 한다).
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # 같은 내용(트리)이 병합 전 검사(verify-release.yml)를 이미 다 통과했으면 아래 전체 검사 대신 빠른 검사만 — 공개 한 번에 같은 전체 검사가
      # 두 번(20분 + 18분) 돌았다(대표 결정 11/24 'B'). 병합된 바로 그 PR 머리의 기록만 · 마지막 성공 배포 이후 검사 장치(.github/·run-all.js·
      # package*.json·이 판단 스크립트)가 바뀌었거나, 기록이 없거나, 무엇이든 확인이 안 되면 run 이 비어 전체 검사를 돈다(scripts/verified-tree.mjs — 실패로 끝나지 않는다).
      - name: Find the same tree already verified before merge
        id: verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verified-tree.mjs "$GITHUB_OUTPUT"

      - name: Install security test browser
        if: steps.verified.outputs.run == ''   # 전체 검사 때만 브라우저
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/hj-e2e" --no-save --package-lock=false playwright@1.55.0
          "$RUNNER_TEMP/hj-e2e/node_modules/.bin/playwright" install --with-deps chromium

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify release guards (full suite)
        if: steps.verified.outputs.run == ''   # 같은 트리 기록이 없으면(또는 확인이 안 되면) 전체 검사
        shell: bash
        run: |
          set -euo pipefail
          # 예전에는 82개 중 8개만 돌렸다 — 나머지는 "로컬에서 돌렸다"는 말에
          # 의존했고, 게이트가 못 보는 회귀가 실제로 있었다. 이제 전부 돈다.
          # (러너가 static-server 8299 · mock-relay 8398 을 직접 띄우고 끈다)
          export NODE_PATH="$RUNNER_TEMP/hj-e2e/node_modules"
          # 옛 e2e 상당수가 /opt/pw-browsers/chromium 을 하드코딩한다 — 심링크로 맞춘다
          CHROME="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sfn "$CHROME" /opt/pw-browsers/chromium
          export PLAYWRIGHT_EXECUTABLE="$CHROME"
          node tests/run-all.js

      - name: Verify release guards (quick — the same tree passed the full suite before merge)
        if: steps.verified.outputs.run != ''
        shell: bash
        env:
          VERIFIED_RUN: ${{ steps.verified.outputs.run }}
        run: |
          set -euo pipefail
          echo "병합 전 전체 검사: https://github.com/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN"
          node tests/run-all.js .check.js .unit.js

      - name: Stage public site allowlist
        run: node scripts/stage-pages.mjs _site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # 공개 앱 셸만 업로드 — backup/, tests/, apps-script/는 Pages에 노출하지 않는다.
          path: "_site"
          # v5는 숨김 파일을 기본 제외하므로 Pages의 .nojekyll을 명시적으로 보존한다.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
