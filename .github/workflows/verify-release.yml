name: Verify release before merge

on:
  pull_request:
    branches:
      - main

# PR 검사는 공개 배포/환경/비밀값에 접근하지 않는다.
permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    # ubuntu-latest 가 26.04 로 넘어가면서(2026-11-17 확인) playwright@1.55.0 이 브라우저를 못 깐다
    # ('Playwright does not support chromium on ubuntu26.04-x64') — 검사가 시작도 못 한다. 11/15 까지 통과하던 24.04 로 고정한다.
    # playwright 를 26.04 지원 판으로 올릴 때 같이 풀 것(브라우저 판이 바뀌므로 전체 회귀를 다시 봐야 한다).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          # 고정 기준 커밋과 merge-base를 대조하는 격리 검사가 전체 이력을 요구한다.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install security test browser
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/hj-e2e" --no-save --package-lock=false playwright@1.55.0
          "$RUNNER_TEMP/hj-e2e/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify release guards (full suite)
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/hj-e2e/node_modules"
          CHROME="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sfn "$CHROME" /opt/pw-browsers/chromium
          export PLAYWRIGHT_EXECUTABLE="$CHROME"
          node tests/run-all.js

      - name: Verify CDN integrity hashes against live bytes
        # _CDN 표의 sha384 가 jsDelivr 가 실제로 주는 바이트와 같은지(다르면 엑셀·PDF·지도·OCR 가 폰에서 멈춘다).
        # 개발 컨테이너는 바깥 주소가 막혀 못 돌린다 — 네트워크가 되는 이 단계가 병합 전 확인이다.
        run: node tests/tools/sri-live.mjs --strict

      - name: Verify selected-sharing protection mutations
        run: node tests/biz-select.mutations.js

      - name: Verify test-stability protection mutations
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/hj-e2e/node_modules"
          export PLAYWRIGHT_EXECUTABLE="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          node tests/test-stability.mutations.js

      - name: Stage public allowlist without publishing
        run: node scripts/stage-pages.mjs _verify_site

      - name: Verify selected-document protections without publishing
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/hj-e2e/node_modules"
          export PLAYWRIGHT_EXECUTABLE="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          node tests/document-select.mutations.js

      - name: Verify document-upload protections without publishing
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/hj-e2e/node_modules"
          export PLAYWRIGHT_EXECUTABLE="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          node tests/document-upload.mutations.js

      - name: Verify duplicate-original protections without publishing
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/hj-e2e/node_modules"
          export PLAYWRIGHT_EXECUTABLE="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          node tests/photo-original-keep.mutations.js
          node tests/photo-no-recovery.mutations.js

      # 맨 끝(위 단계가 모두 통과했을 때만) — 배포(deploy-pages.yml)가 같은 내용을 다시 다 검사하지 않게, 검사한 바로 그 트리 이름을 남긴다.
      # 이 단계 뒤에 검사 단계를 더하지 마라(기록이 검사보다 먼저 남는다). scripts/verified-tree.mjs · tests/verified-tree.unit.js
      - name: Record the verified tree
        id: tree
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(git rev-parse 'HEAD^{tree}')"
          mkdir -p "$RUNNER_TEMP/verified-tree"
          printf '%s\n' "$TREE" > "$RUNNER_TEMP/verified-tree/tree.txt"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"

      - name: Upload the verified tree record
        uses: actions/upload-artifact@v7
        with:
          name: verified-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/verified-tree/tree.txt
          retention-days: 14
          if-no-files-found: error
